<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tik tak toe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1 class="hero-title">
            <span class="hero-ornament hero-ornament-left" aria-hidden="true">X</span>
            <span class="hero-title-text">TIC TAC TOE</span>
            <span class="hero-ornament hero-ornament-right" aria-hidden="true">O</span>
        </h1>

        <div class="mode-panel" id="mode-panel">
            <p class="mode-title">Choose Game Mode</p>
            <div class="mode-buttons">
                <button type="button" id="two-player-btn" data-mode="two-player" class="mode-card">
                    <span class="mode-card-decoration" aria-hidden="true"></span>
                    <span class="mode-card-decoration-alt" aria-hidden="true"></span>
                    <span class="mode-card-icon" aria-hidden="true">👥</span>
                    <span class="mode-card-title">Two Players</span>
                    <span class="mode-card-subtitle">Classic local play</span>
                </button>
                <button type="button" id="computer-btn" data-mode="computer" class="mode-card">
                    <span class="mode-card-decoration" aria-hidden="true"></span>
                    <span class="mode-card-decoration-alt" aria-hidden="true"></span>
                    <span class="mode-card-icon" aria-hidden="true">🤖</span>
                    <span class="mode-card-title">Play vs Computer</span>
                    <span class="mode-card-subtitle">Challenge the AI</span>
                </button>
            </div>
        </div>

        <div class="game-shell hide" id="game-shell">
            <div class="controls">
                <div class="turn">Turn: <span id="turn-indicator">X</span></div>
                <div class="buttons">
                    <button id="new-btn">Restart Game</button>
                    <button id="reset-btn">Change Mode</button>
                    <button id="reset-scores-btn">Reset Scores</button>
                </div>
            </div>

            <div class="scoreboard">
                <div class="scoreboard-row">
                    <div class="score-card">
                        <span id="score-x-label">X Wins</span>
                        <strong id="score-x">0</strong>
                    </div>
                    <div class="score-card">
                        <span id="score-o-label">O Wins</span>
                        <strong id="score-o">0</strong>
                    </div>
                    <div class="score-card">
                        <span id="score-draw-label">Draws</span>
                        <strong id="score-draws">0</strong>
                    </div>
                </div>
                <div class="score-meta">Total Games: <span id="total-games">0</span></div>
            </div>

            <div class="container">
                <div class="game">
                    <button class="box" aria-label="Board cell 1"></button>
                    <button class="box" aria-label="Board cell 2"></button>
                    <button class="box" aria-label="Board cell 3"></button>
                    <button class="box" aria-label="Board cell 4"></button>
                    <button class="box" aria-label="Board cell 5"></button>
                    <button class="box" aria-label="Board cell 6"></button>
                    <button class="box" aria-label="Board cell 7"></button>
                    <button class="box" aria-label="Board cell 8"></button>
                    <button class="box" aria-label="Board cell 9"></button>
                </div>
            </div>
        </div>

        <div class="msg-container hide">
            <div id="msg"></div>
            <button id="play-again">Play Again</button>
        </div>

        <div class="dialog-overlay hide" id="reset-scores-dialog" aria-hidden="true">
            <div class="dialog-card" role="dialog" aria-modal="true" aria-labelledby="reset-scores-title" aria-describedby="reset-scores-desc">
                <div class="dialog-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                        <path d="M3 6h18M9 6V4.75A1.75 1.75 0 0 1 10.75 3h2.5A1.75 1.75 0 0 1 15 4.75V6m-7 0 .72 12.21A1.75 1.75 0 0 0 10.47 20h3.06a1.75 1.75 0 0 0 1.75-1.79L16 6m-7 0h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <h2 id="reset-scores-title">Reset Scores?</h2>
                <p id="reset-scores-desc">This will permanently clear all game statistics.</p>
                <div class="dialog-actions">
                    <button type="button" id="reset-scores-cancel">
                        <svg class="dialog-button-icon" viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                            <path d="M18 6 6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
                        </svg>
                        <span>Cancel</span>
                    </button>
                    <button type="button" id="reset-scores-confirm">
                        <svg class="dialog-button-icon" viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                            <path d="M3 6h18M9 6V4.75A1.75 1.75 0 0 1 10.75 3h2.5A1.75 1.75 0 0 1 15 4.75V6m-7 0 .72 12.21A1.75 1.75 0 0 0 10.47 20h3.06a1.75 1.75 0 0 0 1.75-1.79L16 6m-7 0h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span>Reset</span>
                    </button>
                </div>
            </div>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
